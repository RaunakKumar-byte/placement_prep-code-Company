<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Change Text Example</title>
</head>
<body>

    <button onclick="changeText(this)">Click</button>

    <script>
        function changeText(btn) {
            btn.innerHTML = "Clicked";
            document.write(btn.innerHTML);
        }
    </script>

</body>
</html>
